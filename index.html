<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rangrez Garba 2026</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    .hero {
      text-align: center;
      padding: 60px 20px;
      background: #241008;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .hero p {
      font-size: 18px;
    }

    .booking {
      max-width: 500px;
      margin: 40px auto;
      padding: 25px;
      background: #222;
      border-radius: 15px;
    }

    h2 {
      text-align: center;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #e58b24;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #c96f12;
    }

    #message {
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <section class="hero">
    <h1>Rangrez Garba 2026</h1>
    <p>Book your tickets now</p>
  </section>

  <section class="booking">

    <h2>Book Your Ticket</h2>

    <form id="bookingForm">

      <label>Full Name</label>
      <input
        type="text"
        id="name"
        placeholder="Enter your name"
        required
      >

      <label>Mobile Number</label>
      <input
        type="tel"
        id="phone"
        placeholder="10-digit mobile number"
        maxlength="10"
        required
      >

      <label>Email</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label>Ticket Type</label>
      <select id="ticketType" required>
        <option value="">Select ticket</option>
        <option value="499">General - ₹499</option>
        <option value="999">VIP - ₹999</option>
      </select>

      <label>Number of Tickets</label>
      <select id="quantity" required>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
      </select>

      <button type="submit">
        Book Ticket
      </button>

      <p id="message"></p>

    </form>

  </section>

  <script>
    document
      .getElementById("bookingForm")
      .addEventListener("submit", function (e) {

        e.preventDefault();

        const name = document.getElementById("name").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const email = document.getElementById("email").value.trim();

        if (!name || !phone || !email) {
          alert("Please fill all details");
          return;
        }

        if (!/^[0-9]{10}$/.test(phone)) {
          alert("Please enter a valid 10-digit mobile number");
          return;
        }

        document.getElementById("message").textContent =
          "Booking details submitted successfully!";

      });
  </script>

</body>
</html>
