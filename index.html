<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rangrez Garba 2026</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: white;
  background:
    linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.7)),
    url("https://images.unsplash.com/photo-1531058020387-3be344556be6?auto=format&fit=crop&w=1600&q=80")
    center/cover fixed;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 30px 20px;
}

.hero {
  text-align: center;
  padding: 50px 10px 30px;
}

.hero h1 {
  font-size: 42px;
  margin: 0;
}

.hero p {
  font-size: 18px;
}

.event {
  background: rgba(0,0,0,.65);
  padding: 25px;
  border-radius: 18px;
  text-align: center;
  margin-bottom: 25px;
}

.event div {
  margin: 12px 0;
  font-size: 17px;
}

.booking {
  background: rgba(255,255,255,.95);
  color: #222;
  padding: 25px;
  border-radius: 18px;
}

.booking h2 {
  text-align: center;
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 6px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
}

.price {
  text-align: center;
  margin: 20px 0;
  font-size: 24px;
  font-weight: bold;
}

button {
  width: 100%;
  padding: 15px;
  border: 0;
  border-radius: 10px;
  background: #e08b25;
  color: white;
  font-size: 18px;
  font-weight: bold;
}

button:active {
  transform: scale(.98);
}
</style>
</head>

<body>

<div class="container">

  <div class="hero">
    <h1>Rangrez Garba 2026</h1>
    <p>Celebrate • Dance • Create Memories</p>
  </div>

  <div class="event">

    <div>📅 <b>14 October 2026</b></div>

    <div>⏰ <b>5:30 PM onwards</b></div>

    <div>📍 <b>Shree Devi College, Kenjar</b></div>

    <div>🎟️ <b>Ticket: ₹399</b></div>

  </div>

  <div class="booking">

    <h2>🎟️ Book Your Ticket</h2>

    <form id="bookingForm">

      <label>Full Name</label>
      <input
        type="text"
        id="name"
        placeholder="Enter your name"
        required
      >

      <label>Mobile Number</label>
      <input
        type="tel"
        id="phone"
        placeholder="10-digit mobile number"
        maxlength="10"
        required
      >

      <label>Email</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <div class="price">
        ₹399
      </div>

      <button type="submit">
        Pay ₹399 & Book Ticket
      </button>

    </form>

  </div>

</div>

<script>
document.getElementById("bookingForm").addEventListener("submit", function(e) {

  e.preventDefault();

  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const email = document.getElementById("email").value.trim();

  if (!name || !phone || !email) {
    alert("Please fill all details");
    return;
  }

  if (!/^[0-9]{10}$/.test(phone)) {
    alert("Enter a valid 10-digit mobile number");
    return;
  }

  alert("Details saved. Payment will be connected next.");

});
</script>

</body>
</html>
